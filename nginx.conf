server {
    listen 80;
    server_name matkaresult.kingwins.pro;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name matkaresult.kingwins.pro;

    ssl_certificate /etc/letsencrypt/live/matkaresult.kingwins.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matkaresult.kingwins.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    location /static/ {
        alias /var/lib/docker/volumes/resultapi_static_volume/_data/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
