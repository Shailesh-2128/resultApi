version: '3.8'

services:
  web:
    build: .
    restart: always
    command: gunicorn --config gunicorn.conf.py config.wsgi:application
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - logs_volume:/app/logs
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis

  worker:
    build: .
    restart: always
    command: celery -A config worker -l info --concurrency=4
    volumes:
      - .:/app
      - logs_volume:/app/logs
    env_file:
      - .env
    depends_on:
      - redis

  beat:
    build: .
    restart: always
    command: celery -A config beat -l info
    volumes:
      - .:/app
      - logs_volume:/app/logs
    env_file:
      - .env
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --save "" --stop-writes-on-bgsave-error no --appendonly no
    ports:
      - "6379:6379"

volumes:
  static_volume:
  logs_volume:
